name: Generate Snake

on:
  schedule:            # runs automatically every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate the snake files
        uses: Platane/snk@v3
        with:
          github_user_name: BeniSpec
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ec4899&color_dots=#ebedf0,#e9d5ff,#d8b4fe,#c084fc,#a855f7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ec4899&color_dots=#1c1830,#4c1d95,#7e22ce,#a855f7,#c084fc

      - name: Push the snake files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
