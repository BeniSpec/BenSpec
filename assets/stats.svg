<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="GitHub stats for BeniSpec: activity grade A">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <clipPath id="bar"><rect x="578" y="92" width="284" height="10" rx="5"/></clipPath>
  </defs>
  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .title{fill:#c084fc;font-size:17px;font-weight:700}
    .k{fill:#d8ccf5;font-size:13px}
    .v{fill:#f0ecff;font-size:13px;font-weight:700}
    .grade{fill:#f0ecff;font-size:40px;font-weight:800}
    .cap{fill:#9d8fc0;font-size:10px;letter-spacing:1.5px}
    .scale{fill:#9d8fc0;font-size:10px}
    .ring{stroke-dasharray:301.6;stroke-dashoffset:167.7;animation:draw 1.6s ease-out}
    @keyframes draw{from{stroke-dashoffset:301.6}}
  </style>

  <!-- left card -->
  <rect x="18" y="18" width="520" height="264" rx="12" fill="#0b0a12" stroke="#2e2845"/>
  <text class="title" x="40" y="54">Benat Siraj Ahmed's GitHub Stats</text>
  <text class="k" x="40" y="96">Total Stars Earned</text><text class="v" x="290" y="96" text-anchor="end">31</text>
  <text class="k" x="40" y="123">Contributions (12 mo)</text><text class="v" x="290" y="123" text-anchor="end">1,222</text>
  <text class="k" x="40" y="150">Commits (12 mo)</text><text class="v" x="290" y="150" text-anchor="end">1,167</text>
  <text class="k" x="40" y="177">Pull Requests (12 mo)</text><text class="v" x="290" y="177" text-anchor="end">23</text>
  <text class="k" x="40" y="204">Issues (12 mo)</text><text class="v" x="290" y="204" text-anchor="end">0</text>
  <text class="k" x="40" y="231">Active Days (12 mo)</text><text class="v" x="290" y="231" text-anchor="end">84</text>
  <circle cx="440" cy="130" r="48" fill="none" stroke="#2e2845" stroke-width="8"/>
  <circle class="ring" cx="440" cy="130" r="48" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" transform="rotate(-90 440 130)"/>
  <text class="grade" x="440" y="144" text-anchor="middle">A</text>
  <text class="cap" x="440" y="202" text-anchor="middle">ACTIVITY GRADE</text>
  <line x1="40" y1="246" x2="516" y2="246" stroke="#2e2845"/>
  <text class="scale" x="40" y="266">Scale (contributions/yr): A+ 1,500  ·  A 1,000  ·  B+ 750  ·  B 500  ·  C+ 300</text>

  <!-- right card -->
  <rect x="558" y="18" width="324" height="264" rx="12" fill="#0b0a12" stroke="#2e2845"/>
  <text class="title" x="578" y="54">Most Used Languages</text>
  <text class="scale" x="578" y="76">by repositories</text>
  <g clip-path="url(#bar)">
    <rect x="578.0" y="92" width="113.6" height="10" fill="#DA5B0B"/>
    <rect x="691.6" y="92" width="94.7" height="10" fill="#3572A5"/>
    <rect x="786.3" y="92" width="37.9" height="10" fill="#b07219"/>
    <rect x="824.1" y="92" width="37.9" height="10" fill="#A97BFF"/>
  </g>
  <circle cx="586" cy="136" r="5" fill="#DA5B0B"/><text class="k" x="602" y="140">Jupyter Notebook</text><text class="v" x="862" y="140" text-anchor="end">40%</text>
  <circle cx="586" cy="162" r="5" fill="#3572A5"/><text class="k" x="602" y="166">Python</text><text class="v" x="862" y="166" text-anchor="end">33%</text>
  <circle cx="586" cy="188" r="5" fill="#b07219"/><text class="k" x="602" y="192">Java</text><text class="v" x="862" y="192" text-anchor="end">13%</text>
  <circle cx="586" cy="214" r="5" fill="#A97BFF"/><text class="k" x="602" y="218">Kotlin</text><text class="v" x="862" y="218" text-anchor="end">13%</text>
</svg>
