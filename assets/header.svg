<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Benat Siraj Ahmed, Computer Science Student, Data Analytics, Data Science, End-to-End Full Stack Mobile App Developer">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1c1830" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .l{opacity:0;animation:in .7s ease forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.8s}.d3{animation-delay:1.4s}.d4{animation-delay:2s}.d5{animation-delay:2.6s}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .dot{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.3}}
  </style>

  <rect width="900" height="280" rx="16" fill="#0b0a12"/>
  <rect width="900" height="280" rx="16" fill="url(#grid)"/>
  <circle cx="130" cy="40" r="90" fill="#a855f7" opacity=".28" filter="url(#blur)"/>
  <circle cx="800" cy="260" r="100" fill="#ec4899" opacity=".22" filter="url(#blur)"/>
  <text x="868" y="205" text-anchor="end" font-size="120" font-weight="800" fill="#a855f7" opacity=".10">&lt;/&gt;</text>

  <!-- window bar -->
  <rect x="1" y="1" width="898" height="36" rx="15" fill="#13111f"/>
  <rect x="1" y="22" width="898" height="15" fill="#13111f"/>
  <line x1="1" y1="37" x2="899" y2="37" stroke="#2e2845"/>
  <circle cx="26" cy="19" r="6" fill="#ec4899"/><circle cx="46" cy="19" r="6" fill="#a855f7"/><circle cx="66" cy="19" r="6" fill="#34d399"/>
  <text x="450" y="24" text-anchor="middle" font-size="13" fill="#9d8fc0">benat@aiu: ~/portfolio</text>

  <!-- content -->
  <text class="l d1" x="40" y="86" font-size="18"><tspan fill="#34d399">$</tspan><tspan fill="#f0ecff"> whoami</tspan></text>
  <text class="l d2" x="40" y="146" font-size="46" font-weight="800" letter-spacing="2" fill="url(#g)">BENAT SIRAJ AHMED</text>
  <text class="l d3" x="40" y="182" font-size="20" fill="#f0ecff">Computer Science Student  ·  Albukhary International University</text>
  <text class="l d4" x="40" y="212" font-size="17" fill="#c084fc">Data Analytics  |  Data Science  |  End-to-End Full Stack Mobile App Developer</text>
  <g class="l d5">
    <circle class="dot" cx="46" cy="246" r="5" fill="#34d399"/>
    <text x="60" y="251" font-size="15" fill="#34d399">open to internships &amp; collaboration<tspan class="cur"> ▌</tspan></text>
  </g>
</svg>
