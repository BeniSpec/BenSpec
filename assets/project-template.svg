<svg xmlns="http://www.w3.org/2000/svg" width="440" height="210" viewBox="0 0 440 210" role="img" aria-label="{{PATH}}">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .path{fill:#c084fc;font-size:15px;font-weight:700}
    .chip{fill:#ec4899;font-size:10px;letter-spacing:1px}
    .d{fill:#f0ecff;font-size:13px}
    .tg{fill:#c084fc;font-size:11px}
    .ft{fill:#34d399;font-size:12px}
    .mu{fill:#9d8fc0;font-size:11px}
  </style>
  <rect x=".5" y=".5" width="439" height="209" rx="14" fill="#13111f" stroke="#2e2845"/>
  <rect x="16" y="1" width="408" height="3" rx="1.5" fill="url(#g)"/>

  <circle cx="24" cy="30" r="4" fill="#ec4899"/><circle cx="38" cy="30" r="4" fill="#a855f7"/><circle cx="52" cy="30" r="4" fill="#34d399"/>
  <text class="path" x="68" y="35">{{PATH}}</text>
  <rect x="320" y="20" width="100" height="22" rx="11" fill="none" stroke="#ec4899"/>
  <text class="chip" x="370" y="35" text-anchor="middle">{{CHIP}}</text>

  <text class="d" x="22" y="82">{{LINE1}}</text>
  <text class="d" x="22" y="102">{{LINE2}}</text>

  <rect x="22"  y="124" width="118" height="24" rx="12" fill="#1c1830" stroke="#2e2845"/><text class="tg" x="81"  y="140" text-anchor="middle">{{TAG1}}</text>
  <rect x="150" y="124" width="118" height="24" rx="12" fill="#1c1830" stroke="#2e2845"/><text class="tg" x="209" y="140" text-anchor="middle">{{TAG2}}</text>
  <rect x="278" y="124" width="118" height="24" rx="12" fill="#1c1830" stroke="#2e2845"/><text class="tg" x="337" y="140" text-anchor="middle">{{TAG3}}</text>

  <line x1="22" y1="170" x2="418" y2="170" stroke="#2e2845"/>
  <text class="ft" x="22" y="193">{{FOOT}}</text>
  <text class="mu" x="418" y="193" text-anchor="end">github.com/BeniSpec</text>
</svg>
